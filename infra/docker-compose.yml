services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_accord
      POSTGRES_USER: api_accord
      POSTGRES_PASSWORD: api_accord
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_accord -d api_accord"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - api_accord_postgres:/var/lib/postgresql/data

volumes:
  api_accord_postgres:
